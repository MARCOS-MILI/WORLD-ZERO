<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Literata:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: ferramenta de consulta para a mesa de jogo. Barra fixa no topo com a busca sempre à mão,
   menu lateral por grupos de capítulos (gaveta no celular) e coluna de leitura de ~68 caracteres. */
:root {
  --bg: #F3F4F9;
  --surface: #FFFFFF;
  --bar: #FFFFFF;
  --fg: #161827;
  --muted: #565A74;
  --rule: #DADCE8;
  --accent: #4638C9;
  --accent-fg: #FFFFFF;
  --tint: #E8E6FA;
  --tint-2: #ECEEF6;
  --mark: #FFE17A;
  --mark-fg: #161827;
  --bad: #A4261D; --bad-bg: #FBE6E4;
  --warn: #7F4B00; --warn-bg: #FAEDCF;
  --low: #3F4560; --low-bg: #E4E7F1;
  --ok: #1B6B36; --ok-bg: #DDF1E3;
  --c-start: #4638C9; --c-create: #5B3FE0; --c-gear: #9C5F08; --c-rules: #0B7C71; --c-world: #B3264F;
  --glow-k: 28%; --rl: 38%;
  --display: "Chakra Petch", system-ui, -apple-system, "Segoe UI", sans-serif;
  --body: "Literata", Georgia, "Times New Roman", serif;
  --bar-h: 58px;
  --fs: 17px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E0F18; --surface: #161826; --bar: #12131F; --fg: #E7E8F3; --muted: #A0A3BC; --rule: #292C42;
    --accent: #ABA0FF; --accent-fg: #0E0F18; --tint: #25224A; --tint-2: #1C1E31;
    --mark: #6A5810; --mark-fg: #FFF7D6;
    --bad: #FF9E96; --bad-bg: #3B1C1B; --warn: #F2BF6C; --warn-bg: #352A10; --low: #B5B8CE; --low-bg: #23263A;
    --ok: #8EE0A8; --ok-bg: #16301F;
    --c-start: #ABA0FF; --c-create: #B4A6FF; --c-gear: #F2B552; --c-rules: #5ED6C6; --c-world: #FF8DAA;
    --glow-k: 62%; --rl: 70%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E0F18; --surface: #161826; --bar: #12131F; --fg: #E7E8F3; --muted: #A0A3BC; --rule: #292C42;
  --accent: #ABA0FF; --accent-fg: #0E0F18; --tint: #25224A; --tint-2: #1C1E31;
  --mark: #6A5810; --mark-fg: #FFF7D6;
  --bad: #FF9E96; --bad-bg: #3B1C1B; --warn: #F2BF6C; --warn-bg: #352A10; --low: #B5B8CE; --low-bg: #23263A;
  --ok: #8EE0A8; --ok-bg: #16301F;
  --c-start: #ABA0FF; --c-create: #B4A6FF; --c-gear: #F2B552; --c-rules: #5ED6C6; --c-world: #FF8DAA;
  --glow-k: 62%; --rl: 70%;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bar); z-index: 80; }
body.menu-open { overflow: hidden; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.ic { width: 20px; height: 20px; flex: none; }

/* ---------- barra do topo ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; height: var(--bar-h); background: var(--bar); border-bottom: 1px solid var(--rule); }
.bar-in { height: 100%; display: flex; align-items: center; gap: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.icon-btn { width: 42px; height: 42px; flex: none; display: grid; place-items: center; border: 1px solid var(--rule); border-radius: 6px; background: transparent; cursor: pointer; }
.icon-btn:hover { background: var(--tint-2); }
.brand { display: none; align-items: center; gap: 9px; text-decoration: none; color: var(--fg); font: 700 1.05rem/1 var(--display); letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
.brand svg { width: 26px; height: 26px; color: var(--accent); }
.brand b { font-weight: 400; }
.search { position: relative; flex: 1; min-width: 0; max-width: 680px; }
.search input { width: 100%; height: 42px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); color: var(--fg); font: 500 16px/1 var(--display); padding: 0 42px 0 40px; -webkit-appearance: none; appearance: none; }
.search input::placeholder { color: var(--muted); opacity: 1; }
.search input::-webkit-search-cancel-button { display: none; }
.search .lead { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search .clear { position: absolute; right: 3px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; display: grid; place-items: center; border: 0; background: transparent; color: var(--muted); border-radius: 6px; cursor: pointer; }
.search .clear:hover { background: var(--tint-2); }
.kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font: 600 .72rem var(--display); color: var(--muted); border: 1px solid var(--rule); border-radius: 4px; padding: 2px 6px; display: none; pointer-events: none; }
.search input:not(:placeholder-shown) ~ .kbd { display: none !important; }

/* ---------- menu lateral ---------- */
.shell { display: block; }
.scrim { position: fixed; inset: 0; background: rgba(8, 9, 20, .55); z-index: 65; }
.side { position: fixed; z-index: 70; top: 0; bottom: 0; left: 0; width: min(88vw, 350px); background: var(--surface); border-right: 1px solid var(--rule); overflow-y: auto; overscroll-behavior: contain;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  transform: translateX(-103%); visibility: hidden; transition: transform .2s ease, visibility 0s linear .2s; }
body.menu-open .side { transform: none; visibility: visible; transition: transform .2s ease; }
.side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 12px 4px 16px; }
.side-in { padding: 4px 8px 28px 8px; }
.g-label { font: 600 .7rem var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); padding: 20px 8px 6px; }
.side a.home-link, .side summary { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 8px; border-radius: 6px; font: 600 .95rem/1.25 var(--display); color: var(--fg); text-decoration: none; cursor: pointer; list-style: none; }
.side summary::-webkit-details-marker { display: none; }
.side summary:hover, .side a.home-link:hover { background: var(--tint-2); }
.side summary .n { font: 500 .78rem var(--display); color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }
.side summary .chev { width: 16px; height: 16px; color: var(--muted); transition: transform .15s; flex: none; }
.side details[open] > summary .chev { transform: rotate(90deg); }
.side details.cur > summary { color: var(--accent); }
.pages { list-style: none; margin: 2px 0 8px 16px; padding: 0 0 0 8px; border-left: 1px solid var(--rule); }
.pages a { display: block; padding: 6px 8px; border-radius: 6px; font: 400 .9rem/1.3 var(--display); color: var(--fg); text-decoration: none; overflow-wrap: anywhere; }
.pages a:hover { background: var(--tint-2); }
.pages a.child { padding-left: 22px; color: var(--muted); }
.pages a[aria-current="page"], .side a.home-link[aria-current="page"] { background: var(--tint); color: var(--accent); font-weight: 600; }
.prefs { border-top: 1px solid var(--rule); margin-top: 20px; padding: 16px 8px 0; display: grid; gap: 14px; }
.prefs .lab { font: 600 .7rem var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 8px 4px; font: 500 .85rem var(--display); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.credit { font: 400 .78rem/1.5 var(--display); color: var(--muted); padding: 14px 8px 0; }

/* ---------- conteúdo ---------- */
.main { min-width: 0; padding: 22px max(16px, env(safe-area-inset-right, 0px)) 80px max(16px, env(safe-area-inset-left, 0px)); outline: none; }
.doc { max-width: 900px; margin: 0 auto; }
.crumbs { font: 500 .75rem var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--accent); text-decoration: underline; }
h1 { font: 700 clamp(1.85rem, 6vw, 2.9rem)/1.08 var(--display); letter-spacing: -.01em; margin: .3em 0 .55em; text-wrap: balance; overflow-wrap: anywhere; }
.lede { color: var(--muted); font-size: 1.02rem; margin: -.2em 0 1.4em; max-width: 60ch; }
.body { font-size: var(--fs); line-height: 1.68; }
.body > p, .body > ul, .body > h3, .body > h4 { max-width: 68ch; }
.body p { margin: .8em 0; overflow-wrap: break-word; }
.body p.it { font-style: italic; color: var(--muted); }
.body strong { font-weight: 700; }
.body ul { margin: .8em 0; padding-left: 1.3em; }
.body li { margin: .38em 0; }
.body li::marker { color: var(--accent); }
.body h3.in { position: relative; font: 600 1.4rem/1.2 var(--display); margin: 2.6em 0 .5em; padding-top: 1.5em; text-wrap: balance; }
.body h3.in::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 9px; background:
  linear-gradient(var(--rule), var(--rule)) left center / calc(50% - 14px) 1px no-repeat,
  linear-gradient(var(--rule), var(--rule)) right center / calc(50% - 14px) 1px no-repeat; }
.body h3.in::after { content: ""; position: absolute; top: 1px; left: calc(50% - 4px); width: 8px; height: 8px; background: var(--gc, var(--accent)); transform: rotate(45deg); }
.body h4.sub { font: 600 1.06rem/1.3 var(--display); color: var(--gc, var(--accent)); margin: 1.7em 0 .25em; text-wrap: balance; }
.body h4.sub::before { content: ""; display: inline-block; width: 6px; height: 6px; margin: 0 .55em .15em 0; background: currentColor; transform: rotate(45deg); }
.body h4.sub strong { font-weight: 600; }
[data-b] { scroll-margin-top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 58px); }
.tw { overflow-x: auto; margin: 1.1em 0; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); }
.tw table { border-collapse: collapse; width: 100%; font-size: .88em; line-height: 1.5; font-variant-numeric: tabular-nums; }
.tw th { text-align: left; font: 600 .78rem var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--tint-2); padding: .65em .95em; white-space: nowrap; }
.tw td { padding: .6em .95em; border-top: 1px solid var(--rule); vertical-align: top; min-width: 5ch; }
.tw tbody tr:first-child td { border-top: 0; }
.flash { animation: flash 2s ease-out; }
@keyframes flash { 0% { background: var(--mark); } 100% { background: transparent; } }
mark { background: var(--mark); color: var(--mark-fg); border-radius: 2px; padding: 0 .06em; }
mark.cur { outline: 2px solid var(--accent); outline-offset: 1px; }

.toc { margin: 0 0 1.6em; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); }
.toc summary { cursor: pointer; padding: 11px 14px; font: 600 .92rem var(--display); }
.toc ul { list-style: none; margin: 0; padding: 4px 14px 14px; max-height: 42vh; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 2px 18px; }
.toc a { display: block; padding: 5px 0; font: 400 .9rem/1.3 var(--display); text-decoration: none; color: var(--fg); overflow-wrap: anywhere; }
.toc a:hover { color: var(--accent); text-decoration: underline; }

.hlbar { position: sticky; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); z-index: 40; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: 0 0 1.2em; padding: 8px 10px; background: var(--tint); border: 1px solid var(--rule); border-radius: 6px; font: 500 .88rem var(--display); }
.hlbar .t { flex: 1 1 160px; min-width: 0; overflow-wrap: anywhere; }
.hlbar button { border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; padding: 6px 10px; font: 500 .85rem var(--display); cursor: pointer; }
.hlbar button:hover { border-color: var(--accent); }

.pn { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 0; }
.pn a { flex: 1 1 220px; min-width: 0; display: block; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); text-decoration: none; color: var(--fg); }
.pn a:hover { border-color: var(--accent); }
.pn small { display: block; font: 500 .72rem var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.pn b { font: 600 1rem/1.3 var(--display); overflow-wrap: anywhere; }
.pn a.next { text-align: right; }

/* ---------- início, capítulos, busca ---------- */
.hero { display: flex; align-items: center; gap: 16px; margin-bottom: .4em; }
.hero svg { width: clamp(44px, 10vw, 76px); height: auto; color: var(--accent); flex: none; }
.hero h1 { margin: 0; letter-spacing: .1em; text-transform: uppercase; font-size: clamp(2.3rem, 9vw, 4.6rem); line-height: 1; }
.hero h1 b { font-weight: 400; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; }
.chip { border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 6px 13px; font: 500 .88rem var(--display); color: var(--fg); text-decoration: none; cursor: pointer; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.hint { font: 600 .72rem var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 1.8em 0 .6em; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 10px; }
.card { display: block; min-width: 0; padding: 13px 15px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); text-decoration: none; color: var(--fg); }
.card:hover { border-color: var(--accent); }
.card b { display: block; font: 600 1.02rem/1.25 var(--display); overflow-wrap: anywhere; }
.card .pv { margin-top: 3px; color: var(--muted); font-size: .88rem; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card small { display: block; margin-top: 3px; color: var(--muted); font: 500 .8rem var(--display); }
.card.sub-card { margin-left: 18px; }

.res { border-top: 1px solid var(--rule); padding: 16px 0; }
.res:first-of-type { border-top: 0; }
.res h2 { font: 600 1.15rem/1.25 var(--display); margin: 2px 0 6px; }
.res h2 a { color: var(--fg); text-decoration: none; }
.res h2 a:hover { color: var(--accent); text-decoration: underline; }
.res .where { font: 500 .72rem var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.res .snip { display: block; margin: 6px 0; padding: 8px 10px; border-radius: 6px; background: var(--surface); border: 1px solid var(--rule); color: var(--muted); text-decoration: none; font-size: .93rem; line-height: 1.5; overflow-wrap: anywhere; }
.res .snip:hover { border-color: var(--accent); }
.res .more { font: 500 .85rem var(--display); color: var(--muted); }
.btn { display: inline-block; margin-top: 14px; border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; padding: 10px 16px; font: 600 .9rem var(--display); cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.empty { padding: 30px 0; color: var(--muted); max-width: 52ch; }

/* ---------- revisão (só no preview) ---------- */
.issue { border-top: 1px solid var(--rule); padding: 14px 0; max-width: 72ch; }
.issue:first-child { border-top: 0; }
.issue .sev { display: inline-block; font: 700 .68rem var(--display); letter-spacing: .12em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; margin-right: 8px; }
.sev.alto { background: var(--bad-bg); color: var(--bad); }
.sev.med { background: var(--warn-bg); color: var(--warn); }
.sev.baixo { background: var(--low-bg); color: var(--low); }
.issue h4 { display: inline; font: 600 1.05rem/1.4 var(--display); margin: 0; }
.issue p { margin: .45em 0 0; }
.issue .loc { font: 500 .85rem var(--display); color: var(--muted); margin-top: .5em; }
.issue .loc a { margin-right: 10px; }
.sev.ok { background: var(--ok-bg); color: var(--ok); }
.issue ul { margin: .5em 0 0; padding-left: 1.2em; }
.issue li { margin: .2em 0; }
.typos { margin: 1em 0; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); }
.typos summary { cursor: pointer; padding: 11px 14px; font: 600 .92rem var(--display); }
.typos ul { margin: 0; padding: 4px 14px 14px 34px; columns: 2 250px; font-size: .93rem; }
.typos li { break-inside: avoid; margin: .2em 0; overflow-wrap: anywhere; }
.inc-bar { margin: 0 0 1.4em; padding: 11px 14px; border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--rule)); border-left-width: 4px; border-radius: 6px; background: var(--warn-bg); color: var(--warn); font: 500 .93rem/1.5 var(--display); }
.inc-bar b { display: block; margin-bottom: 2px; text-transform: uppercase; letter-spacing: .14em; font-size: .68rem; font-weight: 700; }
.inc-bar a { color: inherit; font-weight: 600; }
.nota { margin: 2em 0 0; padding: 12px 14px; border: 1px dashed var(--rule); border-radius: 6px; background: var(--surface); font: 400 .92rem/1.5 var(--display); color: var(--muted); }
.nota b { display: block; margin-bottom: 2px; font: 700 .68rem var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--gc, var(--accent)); }
.nota p { margin: .35em 0 0; }
.pages a.inc::after { content: ""; display: inline-block; width: 7px; height: 7px; margin-left: 8px; border-radius: 50%; background: var(--warn); vertical-align: middle; }
.card .tag-inc { display: inline-block; margin-top: 6px; padding: 1px 7px; border-radius: 4px; background: var(--warn-bg); color: var(--warn); font: 700 .64rem var(--display); letter-spacing: .12em; text-transform: uppercase; }
.home-credit { margin: 2.4em 0 0; padding-top: 14px; border-top: 1px solid var(--rule); color: var(--muted); font: 500 .85rem/1.5 var(--display); }
.home-credit b { color: var(--fg); font-weight: 600; }
.sg { display: inline-block; box-sizing: border-box; width: calc(var(--n, 3) * 1em); max-width: 100%; overflow: clip; text-align: center; vertical-align: baseline; padding: 0; margin: 0 .1em; border-radius: 3px; font-family: var(--display); font-weight: 600; font-size: .94em; line-height: 1.25; letter-spacing: .1em; white-space: nowrap; user-select: none; color: var(--accent);
  background: color-mix(in srgb, var(--accent) 12%, transparent); box-shadow: inset 0 -1px 0 color-mix(in srgb, var(--accent) 45%, transparent); text-shadow: 0 0 8px color-mix(in srgb, var(--accent) 55%, transparent);
  animation: sgPulse 3.4s ease-in-out var(--d, 0s) infinite; }
.sg::before { content: attr(data-g); }
@keyframes sgPulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }

/* ---------- cores por grupo, emblemas e firulas ---------- */
.gc-start { --gc: var(--c-start); } .gc-create { --gc: var(--c-create); } .gc-gear { --gc: var(--c-gear); }
.gc-rules { --gc: var(--c-rules); } .gc-world { --gc: var(--c-world); }
.bar { position: sticky; }
.bar::after { content: ""; position: absolute; left: 0; bottom: -1px; height: 2px; width: var(--p, 0%); background: var(--accent); }
.emb { display: block; width: 100%; height: 100%; color: var(--gc, var(--accent)); overflow: visible; filter: drop-shadow(0 0 5px color-mix(in srgb, var(--gc, var(--accent)) var(--glow-k), transparent)); }
.page-head { display: flex; align-items: center; gap: 16px; margin: 0 0 .5em; }
.page-head .emb-wrap { width: clamp(78px, 22vw, 118px); aspect-ratio: 1; flex: none; max-width: 100%; }
.page-head .ph-tx { min-width: 0; }
.page-head h1 { margin: .15em 0 0; }
.orn { height: 9px; margin: 2.6em 0 1.4em; position: relative; background:
  linear-gradient(var(--rule), var(--rule)) left center / calc(50% - 14px) 1px no-repeat,
  linear-gradient(var(--rule), var(--rule)) right center / calc(50% - 14px) 1px no-repeat; }
.orn::after { content: ""; position: absolute; top: 0; left: calc(50% - 4px); width: 8px; height: 8px; background: var(--gc, var(--accent)); transform: rotate(45deg); }
.body strong.lead { color: var(--gc, var(--accent)); font-family: var(--display); font-weight: 600; font-size: .94em; }

    h += '<div class="body" id="body">' + e.h + "</div>";
    if (e.no && e.no.length) {
      h += '<aside class="nota" aria-label="Nota do site"><b>Nota do site</b>' + e.no.map(function (n) { return "<p>" + esc(n) + "</p>"; }).join("") + '<p><a href="#andamento-2">Ver todas as alterações</a></p></aside>';
    }
    h += '<div class="orn" aria-hidden="true"></div><nav class="pn" aria-label="Navegar entre páginas">';
    if (order[ix - 1]) h += '<a class="prev" href="' + pageHref(order[ix - 1].id) + '"><small>Anterior</small><b>' + esc(order[ix - 1].t) + "</b></a>";
    if (order[ix + 1]) h += '<a class="next" href="' + pageHref(order[ix + 1].id) + '"><small>Próxima</small><b>' + esc(order[ix + 1].t) + "</b></a>";
    h += '</nav><p class="foot-credit">World Zero 4.7.7 · sistema de <b>J.Carvalho_20</b> · site de <b>Marcos</b></p></article>';
    main.innerHTML = h;
    document.title = e.t + " | World Zero";
    Array.prototype.forEach.call($("body").querySelectorAll("p > strong:first-child, li > strong:first-child"), function (st) {
      if (/:\s*$/.test(st.textContent) && st.parentNode.firstChild === st) st.classList.add("lead");
    });
    decorate($("body")); groupStats($("body")); dropCap($("body"));
    syncSide(e.id, e.sec);
    marks = []; curMark = -1;
    if (hl) {
      var ts = termsOf(hl.q);
      var n = highlightDom($("body"), ts);
      marks = Array.prototype.slice.call($("body").querySelectorAll("mark"));
      if (hl.block != null) {
        jumpTo(hl.block, true);
        var target = main.querySelector('[data-b="' + hl.block + '"] mark');
        if (target) { curMark = marks.indexOf(target); target.classList.add("cur"); }
        var c = $("hlcount"); if (c && marks.length) c.textContent = (curMark > -1 ? curMark + 1 : 1) + " de " + marks.length;
      } else if (marks.length) { gotoMark(1); }
      if (!n) { var bar = $("hlbar"); if (bar) bar.remove(); }
    } else { window.scrollTo(0, 0); }
    startSigils();
  }

  function renderSearch() {
    var q = input.value.trim();
    lastQuery = q;
    var r = runSearch(q);
    var h = '<div class="doc"><div class="crumbs"><a href="#" data-home>Início</a><span>/</span><span>Busca</span></div>';
    if (q.length < 2 || !r.ts.length) {
      h += "<h1>Busca</h1><p class=\"empty\">Digite pelo menos duas letras. A busca ignora acentos e maiúsculas, e vale para todo o livro.</p></div>";
      main.innerHTML = h; document.title = "Busca | World Zero"; syncSide("busca", null); return;
    }
    h += "<h1>" + (r.hits.length ? r.hits.length + (r.hits.length === 1 ? " página" : " páginas") : "Nada encontrado") + "</h1>";
    if (!r.hits.length) {
      h += '<p class="empty">Nenhum resultado para <b>' + esc(q) + "</b>. Tente uma palavra só, ou só o começo dela.</p>" +
        '<div class="chips">' + SUGGEST.map(function (s) { return '<a class="chip" href="#busca" data-suggest="' + esc(s) + '">' + esc(s) + "</a>"; }).join("") + "</div></div>";
      main.innerHTML = h; document.title = "Busca | World Zero"; syncSide("busca", null); return;
    }
    h += '<p class="lede">' + r.snippets + (r.snippets === 1 ? " trecho" : " trechos") + " para <b>" + esc(q) + "</b>.</p>";
    r.hits.slice(0, shown).forEach(function (hit) {
      var e = hit.e, s = secById[e.sec];
      h += '<section class="res ' + s.cls + '"><div class="where">' + esc(s.t) + '</div><h2><span class="ri">' + icon(glyphFor(e)) + '</span><a href="' + pageHref(e.id) + '" data-open="' + e.id + '">' + markString(e.t, r.ts) + "</a></h2>";
      var seen = {};
      var list = hit.blocks.filter(function (b) { return b.kind !== "H3" || hit.blocks.length === 1; });
      if (!list.length) list = hit.blocks;
      list.slice(0, 3).forEach(function (b) {
        h += '<a class="snip" href="' + pageHref(e.id) + '" data-open="' + e.id + '" data-block="' + b.n + '">' + snippet(b, r.ts) + "</a>";
      });
      if (list.length > 3) h += '<div class="more">e mais ' + (list.length - 3) + (list.length - 3 === 1 ? " trecho nesta página" : " trechos nesta página") + "</div>";
      h += "</section>";
    });
    if (r.hits.length > shown) h += '<button class="btn" type="button" id="moreBtn">Mostrar mais ' + Math.min(30, r.hits.length - shown) + " páginas</button>";
    h += "</div>";
    main.innerHTML = h;
    document.title = q + " | World Zero";
    syncSide("busca", null);
  }

  /* ------------------------------------------------------------ roteador */
  function route() {
    var h = decodeURIComponent((location.hash || "").slice(1));
    if (h === "atributos-2") h = "mana-1"; /* endereço antigo do LCM */
    stopMotes(); stopSigils();
    barEl.style.setProperty("--p", "0%");
    setMenu(false);
    var clearBtn = $("clearBtn");
    if (h === "busca") {
      if (!input.value.trim() && lastQuery) input.value = lastQuery;
      clearBtn.hidden = !input.value;
      renderSearch(); window.scrollTo(0, 0); return;
    }
    if (h.indexOf("s-") === 0 && secById[h.slice(2)]) { renderSection(secById[h.slice(2)]); return; }
    if (entById[h]) {
      var hl = pending && pending.id === h ? pending : null;
      pending = null;
      renderPage(entById[h], hl); return;
    }
    renderHome();
  }

  /* ------------------------------------------------------------ eventos */
  var timer = null;
  function onType() {
    $("clearBtn").hidden = !input.value;
    clearTimeout(timer);
    timer = setTimeout(function () {
      shown = 30;
      if (!input.value.trim()) { if ((location.hash || "") === "#busca") { lastQuery = ""; setHash("", true); } return; }
      if ((location.hash || "") === "#busca") renderSearch(); else { lastQuery = input.value.trim(); setHash("busca"); }
    }, 120);
  }
  input.addEventListener("input", onType);
  $("searchForm").addEventListener("submit", function (ev) {
    ev.preventDefault(); clearTimeout(timer); shown = 30;
    if (input.value.trim()) { if ((location.hash || "") === "#busca") renderSearch(); else { lastQuery = input.value.trim(); setHash("busca"); } }
    input.blur();
  });
  $("clearBtn").addEventListener("click", function () {
    input.value = ""; lastQuery = ""; $("clearBtn").hidden = true; input.focus();
    if ((location.hash || "") === "#busca") setHash("", true);
  });
  document.addEventListener("keydown", function (ev) {
    var tag = (ev.target && ev.target.tagName) || "";
    if (ev.key === "/" && tag !== "INPUT" && tag !== "TEXTAREA") { ev.preventDefault(); input.focus(); input.select(); }
    else if (ev.key === "Escape") {
      if (document.body.classList.contains("menu-open")) setMenu(false);
      else if (document.activeElement === input && input.value) { input.value = ""; $("clearBtn").hidden = true; if ((location.hash || "") === "#busca") setHash("", true); }
    }
  });
  $("menuBtn").addEventListener("click", function () { setMenu(true); });
  $("scrim").addEventListener("click", function () { setMenu(false); $("menuBtn").focus(); });
  $("brand").addEventListener("click", function (ev) { ev.preventDefault(); goHome(); });
  function goHome() { setHash(""); }

  side.addEventListener("click", function (ev) {
    var t = ev.target;
    if (t.closest("#closeMenu")) { setMenu(false); $("menuBtn").focus(); return; }
    var home = t.closest("[data-home]");
    if (home) { ev.preventDefault(); setMenu(false); goHome(); return; }
    var pref = t.closest("[data-pref] button");
    if (pref) {
      var name = pref.parentNode.getAttribute("data-pref"), v = pref.getAttribute("data-v");
      if (name === "theme") { applyTheme(v); store("wz-theme", v); } else { applySize(v); store("wz-size", v); }
      return;
    }
    var a = t.closest("a[data-id]");
    if (a) { setMenu(false); if (location.hash === a.getAttribute("href")) { ev.preventDefault(); route(); } }
  });

  main.addEventListener("click", function (ev) {
    var t = ev.target, el;
    if ((el = t.closest("[data-home]"))) { ev.preventDefault(); goHome(); return; }
    if ((el = t.closest("[data-suggest]"))) {
      ev.preventDefault(); input.value = el.getAttribute("data-suggest"); $("clearBtn").hidden = false; shown = 30; lastQuery = input.value;
      if ((location.hash || "") === "#busca") renderSearch(); else setHash("busca");
      return;
    }
    if ((el = t.closest("[data-random]"))) {
      var pool = order.filter(function (x) { return x.sec !== "andamento"; }), pick = pool[Math.floor(Math.random() * pool.length)];
      el.classList.add("roll");
      setTimeout(function () { setHash(pick.id); }, reduceMotion ? 0 : 520);
      return;
    }
    if ((el = t.closest("[data-open]"))) {
      var id = el.getAttribute("data-open"), blk = el.getAttribute("data-block");
      pending = { id: id, q: lastQuery, block: blk == null ? null : +blk };
      if (location.hash === "#" + id) { ev.preventDefault(); route(); }
      return;
    }
    if ((el = t.closest("[data-jump]"))) { ev.preventDefault(); jumpTo(+el.getAttribute("data-jump"), true); return; }
    if ((el = t.closest("[data-hl]"))) {
      var k = el.getAttribute("data-hl");
      if (k === "next") gotoMark(1);
      else if (k === "prev") gotoMark(-1);
      else {
        var y = window.scrollY;
        var id2 = decodeURIComponent(location.hash.slice(1));
        renderPage(entById[id2], null); window.scrollTo(0, y);
      }
      return;
    }
    if (t.id === "moreBtn") { shown += 30; var y2 = window.scrollY; renderSearch(); window.scrollTo(0, y2); }
  });

  window.addEventListener("hashchange", route);

  var barEl = document.querySelector(".bar"), toTopEl = $("toTop"), ticking = false;
  window.addEventListener("scroll", function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      ticking = false;
      var max = document.documentElement.scrollHeight - window.innerHeight, onPage = !!document.getElementById("body");
      barEl.style.setProperty("--p", onPage && max > 0 ? Math.min(100, window.scrollY / max * 100).toFixed(1) + "%" : "0%");
      toTopEl.hidden = window.scrollY < 900;
    });
  }, { passive: true });
  toTopEl.addEventListener("click", function () { window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" }); });

  /* ------------------------------------------------------------ início */
  buildSide();
  applyTheme(store("wz-theme") || "auto");
  applySize(store("wz-size") || "17");
  route();
  setTimeout(buildIndex, 50);
})();
</script>
<script>
(function () {
  "use strict";
  var btn = document.getElementById("musicBtn"), panel = document.getElementById("musicPanel"), slot = document.getElementById("musicSlot"), closeBtn = document.getElementById("musicClose"), note = document.getElementById("musicNote");
  if (!btn || !panel) return;
  var YT = "CDWtH8eHeEU", started = false;
  note.innerHTML = 'Toca a música inteira, em loop. Pode fechar esta janelinha que ela continua tocando enquanto você lê. Se o som não começar, aperte o play no vídeo. <a href="https://www.youtube.com/watch?v=' + YT + '" target="_blank" rel="noopener noreferrer">Abrir no YouTube</a>';
  function start() {
    var f = document.createElement("iframe");
    f.src = "https://www.youtube-nocookie.com/embed/" + YT + "?autoplay=1&loop=1&playlist=" + YT + "&rel=0&playsinline=1&modestbranding=1";
    f.title = "Glacius, Schiavoto e Ordem Paranormal (YouTube)";
    f.className = "yt";
    f.setAttribute("allow", "autoplay; encrypted-media; picture-in-picture; fullscreen");
    f.setAttribute("allowfullscreen", "");
    f.setAttribute("loading", "lazy");
    f.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
    slot.appendChild(f);
  }
  function open() {
    if (!started) { started = true; start(); }
    panel.hidden = false; btn.setAttribute("aria-expanded", "true"); btn.classList.remove("hint");
  }
  function close() { panel.hidden = true; btn.setAttribute("aria-expanded", "false"); }
  btn.addEventListener("click", function () { if (panel.hidden) open(); else close(); });
  closeBtn.addEventListener("click", function () { close(); btn.focus(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !panel.hidden) { close(); btn.focus(); } });
})();
</script>
